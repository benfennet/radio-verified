name: collect radio stations

on:
  schedule:
    - cron: "0 22,10 * * *"   # 北京时间 06:00 / 18:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate and verify all stations
        run: python3 collect.py
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
